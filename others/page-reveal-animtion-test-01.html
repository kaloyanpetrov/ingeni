<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Intro</title>
  <style>
    :root {
      --bg: #D7D2C6;
      --text: #fff;
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
    }

    .wrap {
      position: relative;
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      overflow: hidden;
      line-height: 0;
    }

    .wrap::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -2px;
      height: 6px;
      background: var(--bg);
      pointer-events: none;
      z-index: 2;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #D7D2C6;
      display: block;
      vertical-align: top;
      transform: translateZ(0);
      z-index: 1;
    }

    .replay {
      position: fixed;
      right: 16px;
      bottom: 16px;
      border: 1px solid rgba(255, 255, 255, 0.7);
      background: rgba(0, 0, 0, 0.45);
      color: #fff;
      padding: 8px 12px;
      font-size: 12px;
      letter-spacing: 0.08em;
      cursor: pointer;
    }

    .replay:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <main class="wrap" aria-label="Intro video">
    <video id="intro" autoplay muted playsinline preload="auto">
      <source src="../assets/intro.webm" type="video/webm" />
      Your browser does not support the video tag.
    </video>
  </main>

  <button id="replay" class="replay" type="button">Replay</button>

  <script>
    const video = document.getElementById("intro");
    const replay = document.getElementById("replay");

    replay.addEventListener("click", () => {
      video.currentTime = 0;
      video.play().catch(() => {});
    });
  </script>
</body>
</html>
